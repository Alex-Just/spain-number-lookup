<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e7490" />
    <meta
      name="description"
      content="Look up unknown Spain phone numbers across free community databases."
    />
    <title>Spain Number Lookup</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 192 192" focusable="false">
            <defs>
              <linearGradient id="mark-gradient" x1="24" y1="16" x2="170" y2="180" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#1193b2" />
                <stop offset="0.55" stop-color="#0e7490" />
                <stop offset="1" stop-color="#083344" />
              </linearGradient>
            </defs>
            <rect width="192" height="192" fill="url(#mark-gradient)" />
            <line x1="121" y1="119" x2="147" y2="145" stroke="#fff" stroke-width="15" stroke-linecap="round" />
            <circle cx="92" cy="90" r="40" fill="none" stroke="#fff" stroke-width="12" />
            <g transform="translate(61.4 59.4) scale(2.55)" fill="#fff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round">
              <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" />
            </g>
          </svg>
        </div>
        <p class="brand">Spain Number Lookup</p>
      </header>

      <h1>Who called?</h1>
      <p class="lead">Paste or share a Spain number. One clean result from free sources.</p>

      <form id="lookup-form" class="lookup">
        <label for="number-input">Phone number</label>
        <div class="field">
          <input
            id="number-input"
            name="number"
            type="text"
            inputmode="tel"
            autocomplete="tel"
            placeholder="+34 600 000 000"
            required
          />
          <button id="lookup-button" type="submit">Look up</button>
        </div>
        <p class="hint">
          Android Chrome: install this site, then Share a missed-call number into the app.
        </p>
        <p id="status" class="status" aria-live="polite"></p>
      </form>

      <section id="result" class="result" aria-live="polite">
        <div class="summary">
          <p id="result-number" class="number"></p>
          <p id="result-headline" class="headline"></p>
          <div class="meta">
            <span id="result-confidence" class="chip"></span>
          </div>
        </div>
        <p class="section-label">Sources</p>
        <ul id="result-sources" class="sources"></ul>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
