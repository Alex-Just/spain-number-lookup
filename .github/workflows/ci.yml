# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke-check live app
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL%/}"
          test -n "$BASE_URL"
          echo "Checking $BASE_URL"

          shell_html="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 "$BASE_URL/")"
          printf '%s' "$shell_html" | grep -qi '<title>Spain Number Lookup</title>'

          invalid_status="$(curl -sS -o /tmp/invalid.json -w '%{http_code}' \
            --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 \
            "$BASE_URL/api/lookup?number=not-a-number")"
          test "$invalid_status" = "400"
          jq -e 'has("error")' /tmp/invalid.json >/dev/null

          malformed_status="$(curl -sS -o /tmp/malformed.json -w '%{http_code}' \
            --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 \
            -X POST -H 'content-type: application/json' --data '{"number":' \
            "$BASE_URL/api/lookup")"
          test "$malformed_status" = "400"
          jq -e '.error == "Invalid request body"' /tmp/malformed.json >/dev/null

          head -c 9000 /dev/zero | tr '\0' 'x' > /tmp/oversized-body.json
          oversized_status="$(curl -sS -o /tmp/oversized.json -w '%{http_code}' \
            --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 \
            -X POST -H 'content-type: application/json' \
            --data-binary @/tmp/oversized-body.json \
            "$BASE_URL/api/lookup?number=600000000")"
          test "$oversized_status" = "413"
          jq -e '.error == "Request body too large"' /tmp/oversized.json >/dev/null

          lookup_status="$(curl -sS -o /tmp/lookup.json -w '%{http_code}' \
            --retry 5 --retry-delay 2 --retry-all-errors --max-time 30 \
            "$BASE_URL/api/lookup?number=600000000")"
          test "$lookup_status" = "200"
          jq -e '.numberNational == "600000000" and (.sources | type == "array") and (.sources | length > 0)' \
            /tmp/lookup.json >/dev/null

          share_status="$(curl -sS -o /tmp/share.json -w '%{http_code}' \
            --retry 5 --retry-delay 2 --retry-all-errors --max-time 30 \
            -X POST -F 'text=Missed call' \
            -F 'url=https://truecaller.com/search/es/34400300429' \
            "$BASE_URL/api/lookup")"
          test "$share_status" = "200"
          jq -e '.numberNational == "400300429" and (.sources | length > 0)' /tmp/share.json >/dev/null

          echo "Smoke checks passed for $BASE_URL"
